<title>지구별 인생 RPG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 가로형 게임 HUD — 왼쪽 캐릭터 패널, 오른쪽 월드 화면 + 퀘스트 카드 3장 */
:root{
  color-scheme:dark;
  --night:#151a2e; --panel:#222a4a; --panel-2:#2c3662; --edge:#46539a;
  --paper:#fff6df; --paper-ink:#3b2d1c; --paper-edge:#e2c27f;
  --accent:#ff8a1f; --accent-deep:#c45f06; --gold:#ffd23f; --good:#5fd47a; --bad:#ff5d73;
  --text:#f3f1ff; --muted:#a9b1dc;
  --st-s:#ff6b6b; --st-i:#4dabf7; --st-c:#f783ac; --st-d:#ffa94d; --st-j:#ffd43b; --st-m:#e0b739;
  --t-cul:#e8590c; --t-wea:#1c7ed6; --t-env:#2f9e44; --t-grow:#7048e8; --t-job:#c2255c;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --fs:clamp(11px,3.3vh,15px);
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--text);font-family:var(--body);font-size:var(--fs);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(circle at 12% 20%,#2a3360 0,transparent 40%),radial-gradient(circle at 88% 80%,#2b2550 0,transparent 45%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:1280px;margin:0 auto}
.screen{position:absolute;inset:0;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}

/* 공통 게임 버튼 */
.btn{border:0;border-radius:12px;padding:.6em 1.2em;font-family:var(--display);font-size:1.15em;background:var(--accent);color:#fff;
  box-shadow:0 4px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:var(--panel-2);box-shadow:0 4px 0 #1a2042}
.btn.ghost:active{box-shadow:0 1px 0 #1a2042}
.btn.small{font-size:.95em;padding:.4em .8em}
.chip{display:inline-flex;align-items:center;gap:2px;padding:1px 7px;border-radius:999px;font-size:.85em;font-weight:700;background:rgba(0,0,0,.08);white-space:nowrap}
.chip.up{color:#1f7a37;background:#dcf5e2}.chip.down{color:#b3263a;background:#ffe0e5}
.dark .chip.up{color:#8ff0a8;background:rgba(95,212,122,.18)}.dark .chip.down{color:#ff9aa9;background:rgba(255,93,115,.18)}

/* ── 세로 안내 ── */
#rotate{display:none;position:fixed;inset:0;z-index:100;background:var(--night);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#rotate .phone{font-size:64px;animation:turn 2s ease-in-out infinite}
#rotate h2{font-size:24px;color:var(--gold)}
#rotate p{margin:0;color:var(--muted);font-size:15px}
#rotate .skip{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait){body:not(.portrait-ok) #rotate{display:flex}}

/* ── 타이틀 ── */
#title{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:center}
.logo{display:flex;flex-direction:column;gap:6px;min-width:0}
.logo .globe{font-size:clamp(40px,15vh,80px);animation:bob 3s ease-in-out infinite;width:max-content}
.logo h1{font-size:clamp(28px,11vh,58px);line-height:1.05;color:#fff;text-shadow:0 3px 0 var(--accent-deep),0 0 18px rgba(255,138,31,.45);-webkit-text-stroke:1px var(--accent-deep)}
.logo h1 span{color:var(--gold)}
.logo p{margin:0;color:var(--muted);font-size:1.05em;line-height:1.5}
.start-box{background:var(--panel);border:2px solid var(--edge);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.start-box label{font-family:var(--display);color:var(--gold)}
.start-box input{width:100%;padding:.55em .8em;border-radius:10px;border:2px solid var(--edge);background:var(--night);color:var(--text);font:inherit;font-size:1.1em;-webkit-user-select:text;user-select:text}
.start-row{display:flex;gap:8px;flex-wrap:wrap}
.start-row .btn{flex:1}
.dex h3{font-size:1em;color:var(--muted);margin-bottom:4px}
.dex-row{display:flex;flex-wrap:wrap;gap:4px}
.dex-row span{font-size:1.5em;filter:grayscale(1) opacity(.35);transition:filter .3s}
.dex-row span.got{filter:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ── 탄생 ── */
#birth{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.slot{width:clamp(110px,40vh,200px);aspect-ratio:1;max-width:100%;border-radius:24px;background:var(--panel);border:4px solid var(--gold);display:grid;place-items:center;font-size:clamp(60px,24vh,120px);
  box-shadow:0 0 0 6px var(--panel-2),0 0 30px rgba(255,210,63,.35);position:relative}
.slot.spin{animation:shake .12s infinite}
@keyframes shake{50%{transform:translateY(-3px)}}
.birth-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.birth-info .kick{font-family:var(--display);color:var(--gold);font-size:1.1em}
.birth-info h2{font-size:clamp(24px,9vh,44px)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fact{background:var(--panel);border-radius:10px;padding:6px 9px;min-width:0}
.fact b{display:block;font-family:var(--display);font-weight:400;color:var(--muted);font-size:.85em}
.note{color:var(--muted);font-size:.9em;margin:0}
#birth{overflow:auto}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.num{background:var(--panel-2);border:2px solid var(--edge);border-radius:10px;padding:5px 8px;min-width:0}
.num b{display:block;font-weight:400;color:var(--muted);font-size:.78em;line-height:1.25}
.num span{font-family:var(--display);color:var(--gold);font-size:1.2em;font-variant-numeric:tabular-nums}
.num small{color:var(--muted)}

/* ── 게임 ── */
#game{display:grid;grid-template-columns:clamp(160px,25vw,240px) minmax(0,1fr);gap:10px}
.hud{background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto}
.me{display:flex;gap:8px;align-items:center}
.ava{position:relative;width:clamp(40px,14vh,58px);aspect-ratio:1;flex:none;border-radius:50%;background:var(--panel-2);border:2px solid var(--gold);display:grid;place-items:center;font-size:clamp(24px,8.5vh,36px)}
.ava .jb{position:absolute;right:-6px;bottom:-4px;font-size:.5em;background:var(--night);border-radius:50%;padding:2px;line-height:1}
.nm{font-family:var(--display);font-size:1.15em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:.85em;line-height:1.35}
.sub.job{color:var(--gold)}
.lv{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:0 5px;font-family:var(--display);font-size:.9em;margin-right:3px}
.stats{display:flex;flex-direction:column;gap:3px}
.srow{display:grid;grid-template-columns:1.4em 3.4em 1fr 2em;align-items:center;gap:4px;font-size:.9em}
.srow .lab{color:var(--muted)}
.srow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:7px;border-radius:9px;background:var(--night);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .6s cubic-bezier(.2,1.4,.4,1)}
.srow.bump .val{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.5);color:var(--gold)}}
.hud-btns{display:flex;gap:6px;margin-top:auto}
.hud-btns button{flex:1;background:var(--panel-2);border:0;border-radius:8px;padding:5px;font-size:.85em;color:var(--muted)}

.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stages{display:flex;gap:3px;background:var(--panel);border-radius:999px;padding:3px}
.stages span{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;font-size:.95em;filter:grayscale(1) opacity(.45)}
.stages span.done{filter:none;opacity:.7}
.stages span.now{filter:none;background:var(--gold);box-shadow:0 0 0 2px #fff inset}
.pill{background:var(--panel);border-radius:999px;padding:3px 10px;font-family:var(--display);white-space:nowrap}
.pill.age{color:var(--gold)}
.steps{display:flex;gap:3px;margin-left:auto;align-items:center;color:var(--muted);font-size:.85em}
.steps i{width:9px;height:9px;border-radius:50%;background:var(--panel-2);display:inline-block}
.steps i.on{background:var(--good)}

.scene{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--edge);min-height:70px}
.scene canvas{position:absolute;inset:0;width:100%;height:100%}
.ground{position:absolute;left:0;right:0;bottom:0;height:24%;border-top:3px solid rgba(0,0,0,.15)}
.landmark{position:absolute;right:7%;bottom:14%;font-size:clamp(40px,17vh,96px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.hero{position:absolute;left:30%;bottom:14%;font-size:clamp(34px,13vh,70px);animation:bob 2.4s ease-in-out infinite}
.hero .hj{position:absolute;top:-.25em;right:-.35em;font-size:.45em}
.bubble{position:absolute;left:calc(30% + clamp(40px,15vh,80px));bottom:calc(14% + clamp(30px,11vh,60px));max-width:min(55%,320px);background:#fff;color:var(--paper-ink);border-radius:12px;padding:5px 10px;font-size:.92em;line-height:1.35;
  box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bubble::before{content:"";position:absolute;left:-7px;bottom:8px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.flagtag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.35);border-radius:999px;padding:2px 9px;font-family:var(--display);font-size:.9em}
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.banner div{background:rgba(21,26,46,.88);border:3px solid var(--gold);border-radius:16px;padding:10px 22px;text-align:center;font-family:var(--display);font-size:clamp(18px,7vh,32px);color:var(--gold);animation:pop 2.2s forwards}
.banner small{display:block;font-size:.55em;color:#fff;margin-top:2px}
@keyframes pop{0%{transform:scale(.4);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-edge);border-bottom-width:5px;border-radius:12px;padding:6px 8px;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:7px;align-items:center;
  min-height:clamp(58px,22vh,96px);position:relative;transition:transform .12s;animation:deal .35s backwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(2px)}
.card .ic{grid-row:1/3;font-size:clamp(24px,9vh,40px)}
.card .tp{justify-self:start;color:#fff;border-radius:999px;padding:0 7px;font-size:.78em;font-weight:700}
.card h4{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:1.1em;line-height:1.15}
.card .fl{position:absolute;right:6px;top:4px;font-size:.95em}
@keyframes deal{from{transform:translateY(16px) rotate(-3deg);opacity:0}}
.tp.cul{background:var(--t-cul)}.tp.wea{background:var(--t-wea)}.tp.env{background:var(--t-env)}.tp.grow{background:var(--t-grow)}.tp.job{background:var(--t-job)}

/* ── 모달 ── */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,25,.72);display:grid;place-items:center;
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--paper-ink);border:3px solid var(--paper-edge);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:rise .25s;font-size:1.05em}
@keyframes rise{from{transform:translateY(20px) scale(.96);opacity:0}}
.qhead{display:flex;gap:10px;align-items:center}
.qhead .big{font-size:clamp(34px,13vh,54px);line-height:1}
.qhead h3{font-size:1.45em;line-height:1.15}
.qtext{margin:0;line-height:1.5}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choice{background:#fff;border:2px solid var(--paper-edge);border-bottom-width:5px;border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:5px;color:var(--paper-ink)}
.choice:hover{border-color:var(--accent)}
.choice:active{transform:translateY(2px)}
.choice b{font-family:var(--display);font-weight:400;font-size:1.1em;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.tip{margin:0;background:#fff0c7;border-radius:10px;padding:7px 10px;line-height:1.45;font-size:.95em}
.tip b{font-family:var(--display);font-weight:400;color:var(--accent-deep)}
.res{font-family:var(--display);font-size:1.25em;line-height:1.3;margin:0}
.mrow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* 직업 선택 */
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.jobc{background:#fff;border:2px solid var(--paper-edge);border-bottom-width:5px;border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--paper-ink);position:relative}
.jobc:hover{border-color:var(--accent)}
.jobc .je{font-size:clamp(28px,10vh,44px)}
.jobc b{font-family:var(--display);font-weight:400;font-size:1.15em}
.jobc .path{font-size:.8em;color:#7a6a52;line-height:1.35}
.jobc .sp{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:.75em;white-space:nowrap}

/* 전직 시험 */
.test-bar{position:relative;height:clamp(34px,11vh,48px);border-radius:12px;background:#e9dcc0;overflow:hidden;border:3px solid var(--paper-ink);cursor:pointer}
.test-zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#5fd47a 0 10px,#4bc067 10px 20px)}
.test-mark{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--paper-ink);border-radius:3px;box-shadow:0 0 0 2px #fff}
.tries{display:flex;gap:6px;justify-content:center;font-size:1.4em}
.test-msg{text-align:center;font-family:var(--display);font-size:1.2em;margin:0;min-height:1.3em}

/* 엔딩 */
#ending{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:12px;overflow:auto}
.lifecard{background:var(--paper);color:var(--paper-ink);border:4px solid var(--gold);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;align-self:start}
.lifecard .face{font-size:clamp(44px,17vh,80px);line-height:1}
.lifecard h2{font-size:1.6em}
.lifecard .ttl{background:var(--accent);color:#fff;border-radius:999px;padding:1px 12px;font-family:var(--display)}
.lifecard p{margin:2px 0;line-height:1.45}
.jpath{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;font-size:.9em}
.jpath span{background:#f3e3bd;border-radius:8px;padding:1px 6px}
.album{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:1.25em}
.endside{display:flex;flex-direction:column;gap:8px;min-width:0}
.endside .stats{background:var(--panel);border-radius:14px;padding:8px}
.think{background:var(--panel);border:2px dashed var(--edge);border-radius:14px;padding:10px 12px}
.think h3{color:var(--gold);font-size:1.15em;margin-bottom:4px}
.think ol{margin:0;padding-left:1.3em;line-height:1.6}

.toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--panel-2);border:2px solid var(--gold);border-radius:999px;padding:6px 16px;font-family:var(--display);animation:pop 2.6s forwards;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}


/* 타이틀 추가 */
.modes .lbl{font-family:var(--display);color:var(--gold);display:block;margin-bottom:4px}
.modes small{color:var(--muted);font-family:var(--body)}
.mode-row{display:flex;flex-wrap:wrap;gap:4px}
.mode{border:2px solid var(--edge);background:var(--night);border-radius:999px;padding:2px 9px;font-size:.88em}
.mode.on{background:var(--gold);color:var(--paper-ink);border-color:var(--gold)}
.dex-cont{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.85em;color:var(--muted);margin-bottom:3px}
.dex-cont b{color:var(--gold)}
.dex-row em{color:var(--muted);font-size:.9em}
.dex-row span{filter:none}
.start-box{max-height:100%;overflow:auto}
.unit{background:var(--panel);border-radius:12px;padding:7px 12px;font-family:var(--display)}
.unit b{color:var(--gold);font-weight:400}
.tp.clim{background:#0c8599}.tp.cont{background:#5c7cfa}
.mtag{align-self:flex-start;background:var(--paper-ink);color:var(--gold);border-radius:999px;padding:0 8px;font-size:.8em;font-family:var(--display)}

/* 액션 미션 */
#mg{position:fixed;inset:0;z-index:30;background:#111;touch-action:none;-webkit-user-select:none;user-select:none}
#mg canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.mg-hud{position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none}
.mg-pill{background:rgba(21,26,46,.82);border-radius:999px;padding:3px 11px;font-family:var(--display);white-space:nowrap}
.mg-pill.gold{color:var(--gold)}
.mg-timer{flex:1;min-width:60px;height:9px;background:rgba(21,26,46,.7);border-radius:9px;overflow:hidden}
.mg-timer i{display:block;height:100%;background:var(--good);border-radius:9px}
.mg-quit{pointer-events:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(21,26,46,.82);color:#fff}
.mg-ctrl{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:12px}
.mg-ctrl.left{left:max(18px,env(safe-area-inset-left,0px))}
.mg-ctrl.right{right:max(18px,env(safe-area-inset-right,0px))}
.pad{width:clamp(58px,19vh,84px);height:clamp(58px,19vh,84px);border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(21,26,46,.42);color:#fff;font-size:clamp(22px,7vh,32px);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pad.jump{width:clamp(70px,24vh,100px);height:clamp(70px,24vh,100px);background:rgba(255,138,31,.55)}
.pad.on{background:rgba(255,210,63,.7);transform:scale(.94)}
.mg-intro{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,25,.55);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mg-card{background:var(--paper);color:var(--paper-ink);border:3px solid var(--paper-edge);border-radius:18px;padding:12px 16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}

/* 탄생: 실제 출생 비율대로 뽑기 */
function pickCountry(){
  const pool=CIDS.filter(k=>bornMode==='ALL'||C[k].cont===bornMode);
  let sum=0;pool.forEach(k=>sum+=1/C[k].odds);let r=Math.random()*sum;
  for(const k of pool){r-=1/C[k].odds;if(r<=0)return k}return pool[pool.length-1];
}
function startBirth(){
  show('birth');
  const slot=$('#slot'),info=$('#birthInfo');
  info.innerHTML=`<div class="kick">두구두구… 어디에서 태어날까?</div><p class="note">${bornMode==='ALL'?'전 세계':CONT[bornMode].n} 아기들의 실제 출생 비율대로 뽑아요. 태어날 곳은 아무도 고를 수 없어요.</p>`;
  slot.classList.add('spin');
  const cid=pickCountry(),fam=Math.floor(Math.random()*FAM.length);
  let delay=60;
  const tick=()=>{slot.textContent=C[rnd(CIDS)].flag;delay*=1.12;
    if(delay<420)setTimeout(tick,delay);else{slot.classList.remove('spin');slot.textContent=C[cid].flag;reveal(cid,fam)}};
  tick();
}

  const coin=Math.max(3,Math.round(f.m*coinRate(cid)));
  const wl=wealthLv(c.inc);
  $('#birthInfo').innerHTML=`
    <div class="kick">🎉 응애! ${S.name}, 태어났어요!</div>
    <h2>${c.flag} ${c.name}</h2>

      <div class="fact"><b>⛅ 기후 특징</b>${c.climate}</div>

      <div class="num"><b>💰 1인당 소득 수준</b><span>${'💰'.repeat(wl)}<small>${'·'.repeat(4-wl)}</small></span></div>
    </div>
    <p class="note">같은 일을 해도 버는 코인이 나라마다 달라요 (이 나라 ×${coinRate(cid).toFixed(1)}). 모든 수치는 실제 통계예요.</p>
    <div class="chips dark">타고난 능력 ${chips(bonus)}<span class="chip up">+${coin} 🪙</span></div>
    <div><button class="btn" id="btnLife">이 삶을 시작하기 ▶</button></div>`;

}

}

/* 2·3차 전직 시험 (타이밍) */
let testRAF=0;
function testIntro(){
  const tier=S.job.tier+1,nm=S.job.p[(tier-1)*2],em=S.job.p[(tier-1)*2+1],line=S.job.line,stat=S.st[line];
  const zone=Math.min(34,10+stat*0.5);
  let tries=3,hits=0,zs=0,pos=0,dir=1,last=0,locked=false;const res=[];
  const speed=80+tier*18;
  const m=$('#modal');
  m.innerHTML=`<div class="qhead"><span class="big">${em}</span><div><span class="chip" style="background:var(--t-job);color:#fff">${tier}차 전직 시험</span><h3>${jobName()} → ${nm}</h3><p class="qtext">막대가 <b style="color:#2f9e44">초록 칸</b>에 올 때 "멈춰!"를 눌러요. 3번 중 2번 성공하면 전직! (${SM[line].e} ${SM[line].n}이 높을수록 초록 칸이 넓어요)</p></div></div>
   <div class="test-bar" id="tbar"><div class="test-zone" id="tzone"></div><div class="test-mark" id="tmark"></div></div>
   <div class="tries" id="ttries"></div><p class="test-msg" id="tmsg">준비… 시작!</p>
   <div class="mrow"><button class="btn" id="tStop">✋ 멈춰!</button></div>`;
  $('#ov').hidden=false;
  const placeZone=()=>{zs=8+Math.random()*(84-zone);const z=$('#tzone');z.style.left=zs+'%';z.style.width=zone+'%'};
  const drawT=()=>{$('#ttries').innerHTML=Array.from({length:3},(_,i)=>res[i]===undefined?'⚪':res[i]?'⭐':'💨').join('')};
  placeZone();drawT();
  const loop=t=>{if(!last)last=t;const dt=(t-last)/1000;last=t;
    if(!locked){pos+=dir*speed*dt;if(pos>=100){pos=100;dir=-1}if(pos<=0){pos=0;dir=1}const mk=$('#tmark');if(mk)mk.style.left=pos+'%'}
    testRAF=requestAnimationFrame(loop)};
  cancelAnimationFrame(testRAF);testRAF=requestAnimationFrame(loop);
  const press=()=>{if(locked||tries<=0)return;locked=true;tries--;
    const ok=pos>=zs&&pos<=zs+zone;res.push(ok);if(ok)hits++;drawT();
    $('#tmsg').textContent=ok?'⭐ 성공!':'💨 아깝다!';
    setTimeout(()=>{
      if(hits>=2){cancelAnimationFrame(testRAF);passTest(tier,nm,em);return}
      if(tries===0||tries+hits<2){cancelAnimationFrame(testRAF);failTest();return}
      placeZone();locked=false;$('#tmsg').textContent='한 번 더!'},700)};
  $('#tStop').onclick=press;$('#tbar').onclick=press;$('#tStop').focus();
}
function failTest(){
  $('#modal').innerHTML=`<div class="qhead"><span class="big">😵</span><div><h3>아쉽게 실패!</h3><p class="qtext">괜찮아요. 누구나 실패할 수 있어요. 다시 도전해 볼까요?</p></div></div>
   <div class="mrow"><button class="btn" id="tRetry">🔁 다시 도전</button></div>`;
  $('#tRetry').onclick=testIntro;
}
function passTest(tier,nm,em){
  S.job.tier=tier;const pe=adj({[S.job.line]:4,j:5,m:15});applyE(pe);
  $('#modal').innerHTML=`<div class="qhead"><span class="big">${em}</span><div><span class="chip" style="background:var(--gold)">✨ 전직 성공</span><h3>${nm}(이)가 되었어요!</h3><span class="chips">${chips(pe)}</span></div></div>
   <div class="mrow"><button class="btn" id="tGo">다음 인생으로 ▶</button></div>`;
  $('#tGo').onclick=()=>{$('#ov').hidden=true;nextStage();say(`드디어 ${nm}!`)};
}

function updRhythm(dt,taps){
  const tt=M.time;

  const speed=(M.hitY-40)/M.travel;
  for(const tp of taps){const lane={l:0,j:1,r:2}[tp];if(lane===undefined)continue;
    let best=null,bd=99;for(const n of M.notes){if(n.hit||n.miss||n.lane!==lane)continue;const y=M.hitY-(n.t-tt)*speed;const d=Math.abs(y-M.hitY);if(d<bd){bd=d;best=n}}
    if(best&&bd<36){best.hit=true;M.got++;M.combo++;M.fb=bd<14?'PERFECT!':'GOOD';M.fbT=.5;beep([523,659,784][lane]*(bd<14?2:1),.12,'triangle',.12)}
  }
  for(const n of M.notes){if(!n.hit&&!n.miss&&(M.hitY-(n.t-tt)*speed)>M.hitY+36){n.miss=true;M.combo=0;M.fb='MISS';M.fbT=.4}}

}

  const v=vol||.12;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.001,t0+(sty.pluck?dur*.7:sty.bell?dur*1.4:dur));
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur*1.5);
  if(sty.bell){const o2=AC.createOscillator(),g2=AC.createGain();o2.type='sine';o2.frequency.value=f*2.76;g2.gain.setValueAtTime(v*.3,t0);g2.gain.exponentialRampToValueAtTime(.001,t0+dur);o2.connect(g2);g2.connect(AC.destination);o2.start(t0);o2.stop(t0+dur)}}catch(e){}}
function drum(strong){if(!AC)return;try{const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(strong?120:200,t0);o.frequency.exponentialRampToValueAtTime(strong?50:90,t0+.12);
  g.gain.setValueAtTime(strong?.32:.14,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.15);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+.16);
  if(!strong){const b=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const n=AC.createBufferSource(),ng=AC.createGain();n.buffer=b;ng.gain.value=.08;n.connect(ng);ng.connect(AC.destination);n.start(t0)}}catch(e){}}
function initRhythmStyled(W){
  const sty=styleFor();M.sty=sty;M.lanesX=[W*.36,W*.5,W*.64];M.hitY=LH-80;
  const beat=60/(sty.bpm+S.stage*4),step=beat/2;M.beat=beat;M.step=step;M.travel=1.25;M.notes=[];
  const dens=.62+S.stage*.03;let tt=1.6,prev=2;
  for(let i=0;i<72;i++){const strong=sty.dr[i%sty.dr.length]!=='.';
    if(Math.random()<(strong?dens+.2:dens-.25)){let deg=Math.max(0,Math.min(sty.sc.length*2-1,prev+Math.floor(Math.random()*5)-2));prev=deg;
      const oct=Math.floor(deg/sty.sc.length),f=sty.root*Math.pow(2,(sty.sc[deg%sty.sc.length]+12*oct)/12);
      const lane=Math.min(2,Math.floor(deg/(sty.sc.length*2/3)));M.notes.push({t:tt,lane,f,hit:false,miss:false});
      if(Math.random()<.14&&strong){const l2=(lane+1+Math.floor(Math.random()*2))%3;M.notes.push({t:tt,lane:l2,f:f*1.5,hit:false,miss:false})}}
    tt+=step}
  M.need=Math.ceil(M.notes.length*.7);M.end=tt+1.2;M.combo=0;M.fb='';M.fbT=0;M.nextStep=1.6-M.travel*0;M.si=0;M.droneT=0;
}
function updRhythmStyled(dt,taps){
  const tt=M.time,sty=M.sty;
  if(tt>=M.nextStep&&tt<M.end-1){const ch=sty.dr[M.si%sty.dr.length];if(ch!=='.')drum(ch==='X');if(sty.drone&&M.si%8===0)tone(sty.root/2,M.step*8,{wave:'sawtooth'},.035);M.si++;M.nextStep+=M.step}
  const speed=(M.hitY-40)/M.travel;
  for(const tp of taps){const lane={l:0,j:1,r:2}[tp];if(lane===undefined)continue;
    let best=null,bd=99;for(const n of M.notes){if(n.hit||n.miss||n.lane!==lane)continue;const y=M.hitY-(n.t-tt)*speed;const d=Math.abs(y-M.hitY);if(d<bd){bd=d;best=n}}
    if(best&&bd<24){best.hit=true;M.got++;M.combo++;M.fb=bd<10?'PERFECT!':'GOOD';M.fbT=.45;tone(best.f,.35,sty,.14)}
    else{M.combo=0;M.fb='삐끗!';M.fbT=.3;beep(120,.06,'square',.05)}}
  for(const n of M.notes){if(!n.hit&&!n.miss&&(M.hitY-(n.t-tt)*speed)>M.hitY+24){n.miss=true;M.combo=0;M.fb='MISS';M.fbT=.4}}
  M.fbT=Math.max(0,M.fbT-dt);
}

const LIQ=['#ff6b6b','#4dabf7','#ffd43b','#69db7c','#cc5de8'];
function initPour(W){
  const nc=S.stage>=3?5:4,cap=4;let balls=[];for(let c=0;c<nc;c++)for(let i=0;i<cap;i++)balls.push(c);
  let tubes,tries=0;do{balls.sort(()=>Math.random()-.5);tubes=[];for(let t=0;t<nc;t++)tubes.push(balls.slice(t*cap,t*cap+cap));tubes.push([],[]);tries++}while(tries<30&&(tubes.some(t=>t.length&&t.every(x=>x===t[0]))||!pourSolvable(tubes,cap)));M.tubes=tubes;M.cap=cap;M.sel=-1;M.hist=[];M.clicks=[];M.lift=0;M.pourAnim=null;
  const n=tubes.length,tw=Math.min(54,(W-80)/n-14);M.tw=tw;M.th=tw*.9*cap+20;M.tx=i=>W/2-(n*(tw+20))/2+i*(tw+20)+10;M.ty=LH/2-M.th/2+20;
}
function pourSolvable(t,cap){const seen=new Set(),q=[t],key=s=>s.map(x=>x.join('')).sort().join('|');seen.add(key(t));let n=0;
  while(q.length&&n++<20000){const s=q.shift();if(s.every(x=>!x.length||(x.length===cap&&x.every(y=>y===x[0]))))return true;
    for(let a=0;a<s.length;a++)for(let b=0;b<s.length;b++){if(a===b)continue;const A=s[a],B=s[b];if(!A.length||B.length>=cap)continue;const c=A[A.length-1];if(B.length&&B[B.length-1]!==c)continue;
      const m=s.map(x=>x.slice());let r=0;for(let i=A.length-1;i>=0&&A[i]===c;i--)r++;const k2=Math.min(r,cap-B.length);for(let i=0;i<k2;i++)m[b].push(m[a].pop());const k=key(m);if(!seen.has(k)){seen.add(k);q.push(m)}}}return false}
function topRun(t){if(!t.length)return 0;const c=t[t.length-1];let n=0;for(let i=t.length-1;i>=0&&t[i]===c;i--)n++;return n}
function pourTo(a,b){const A=M.tubes[a],B=M.tubes[b];if(!A.length||B.length>=M.cap)return false;const c=A[A.length-1];if(B.length&&B[B.length-1]!==c)return false;
  M.hist.push(M.tubes.map(t=>t.slice()));const n=Math.min(topRun(A),M.cap-B.length);for(let i=0;i<n;i++)B.push(A.pop());M.pourAnim={a,b,c,life:.35};return true}
function solved(){return M.tubes.every(t=>!t.length||(t.length===M.cap&&t.every(x=>x===t[0])))}
function updPour(dt,taps){
  if(taps.includes('j')&&M.hist.length){M.tubes=M.hist.pop();M.sel=-1;pop(LW/2,60,'되돌리기');beep(400,.06)}
  for(const c of M.clicks){const i=M.tubes.findIndex((t,i)=>c.x>M.tx(i)-8&&c.x<M.tx(i)+M.tw+8&&c.y>M.ty-30&&c.y<M.ty+M.th+10);if(i<0){M.sel=-1;continue}
    if(M.sel<0){if(M.tubes[i].length){M.sel=i;beep(600,.05,'triangle')}}
    else if(M.sel===i)M.sel=-1;
    else{if(pourTo(M.sel,i)){beep(500,.12,'sine',.1);const t=M.tubes[i];if(t.length===M.cap&&t.every(x=>x===t[0])){pop(M.tx(i)+M.tw/2,M.ty-36,'완성!');beep(990,.15)}}else{pop(M.tx(i)+M.tw/2,M.ty-36,'안 섞여요!');beep(200,.1,'square',.06)}M.sel=-1}}
  M.clicks=[];if(M.pourAnim){M.pourAnim.life-=dt;if(M.pourAnim.life<=0)M.pourAnim=null}
  if(solved()){M.got=1}
}

function initHarvest(W){

  else{const rows=[LH-104,LH-160,LH-216],cols=8;M.crops=[];

function chop(cr){
  const g=M.g;M.cuts.push({x:cr.x,y:cr.y-18,life:.22});
  if(cr.unripe){hurt('덜 익었어!');cr.unripe=false;cr.cut=true;return}
  cr.hp--;beep(g.animal?500:900-cr.hp*120,.05,'triangle',.08);
  if(cr.hp<=0){M.got++;M.flyers.push({x:cr.x,y:cr.y-20,life:.6,e:g.yield||g.crop});
    if(g.animal){cr.hp=cr.max;cr.cool=1.6;pop(cr.x,cr.y-60,'+1')}else cr.cut=true}
}
function updHarvest(dt,taps){
  for(const c of M.clicks){let best=null,bd=40;for(const cr of M.crops){if(cr.cut||cr.cool>0)continue;const d=Math.hypot(c.x-cr.x,c.y-(cr.y-18));if(d<bd){bd=d;best=cr}}if(best)chop(best)}
  M.clicks=[];
  if(taps.includes('j')){const cr=M.crops.find(c=>!c.cut&&!c.unripe&&!(c.cool>0));if(cr)chop(cr)}
  for(const cr of M.crops)if(cr.cool>0)cr.cool-=dt;
  for(const c of M.cuts)c.life-=dt;M.cuts=M.cuts.filter(c=>c.life>0);
  for(const f of M.flyers){f.life-=dt;f.x+=(40-f.x)*dt*6;f.y+=(LH-40-f.y)*dt*6}M.flyers=M.flyers.filter(f=>f.life>0);
  if(!M.g.animal&&M.crops.every(c=>c.cut)&&M.got<M.need){M.crops.forEach(c=>{c.cut=false;c.hp=c.max;c.unripe=M.g.ripe?Math.random()<.3:false})}

  for(let lx=500;lx<W_.len+600;lx+=900){const sx=lx-cam*.35;if(sx>-150&&sx<W+150)wemo(c.land,sx,WGY-8,130,.32)}

  {const sx=W_.shopX;wx.fillStyle='#8b5a2b';wx.fillRect(sx-46,WGY-70,92,70);for(let i=0;i<6;i++){wx.fillStyle=i%2?'#f06595':'#fff';wx.beginPath();wx.moveTo(sx-50+i*17,WGY-86);wx.lineTo(sx-33+i*17,WGY-86);wx.lineTo(sx-41+i*17,WGY-68);wx.fill()}wx.fillStyle='#fff6df';wx.fillRect(sx-36,WGY-60,72,40);wemo('👕',sx-18,WGY-26,20);wemo('🎩',sx+16,WGY-26,20);wtxt('🛍️ 옷가게',sx,WGY-100,13,'#fff','rgba(240,101,149,.9)');drawPerson(wx,sx+58,WGY+2,54,{skin:'#f1c9a5',hair:'bun',hc:'#6b3e1f',top:'t_stripe',bottom:'b_skirt'},'young',0,-1)}

  {const px=W_.end,ok=S.npcs.every(n=>n.done),spin=ts/250;

function wWeather(w,ts){
  if(w!==W_.pw){W_.pw=w;W_.parts=[]}
  const n=reduce?10:({rain:70,snow:50,petals:24,leaves:20,sand:50}[w]||0);
  while(W_.parts.length<n)W_.parts.push({x:Math.random()*WW,y:Math.random()*WH,s:1+Math.random()*3,a:Math.random()*6});
  for(const p of W_.parts){
    if(w==='rain'){p.y+=9;p.x-=1.5;wx.strokeStyle='rgba(210,230,255,.6)';wx.lineWidth=1.2;wx.beginPath();wx.moveTo(p.x,p.y);wx.lineTo(p.x-2,p.y+12);wx.stroke()}
    else if(w==='snow'){p.y+=.9;p.x+=Math.sin(ts/600+p.a)*.4;wx.fillStyle='rgba(255,255,255,.9)';wx.beginPath();wx.arc(p.x,p.y,p.s,0,7);wx.fill()}
    else if(w==='petals'||w==='leaves'){p.y+=.8;p.x+=.9;p.a+=.04;wx.save();wx.translate(p.x,p.y);wx.rotate(p.a);wx.fillStyle=w==='petals'?'rgba(255,170,200,.9)':'rgba(235,140,40,.9)';wx.beginPath();wx.ellipse(0,0,4+p.s,2.5+p.s*.4,0,0,7);wx.fill();wx.restore()}
    else if(w==='sand'){p.x+=7;wx.strokeStyle='rgba(255,230,180,.55)';wx.lineWidth=1.5;wx.beginPath();wx.moveTo(p.x,p.y);wx.lineTo(p.x+10+p.s*3,p.y);wx.stroke()}
    if(p.y>WH){p.y=-10;p.x=Math.random()*WW}if(p.x>WW+20)p.x=-20;if(p.x<-20)p.x=WW+20;
  }
  if(w==='aurora'){wx.fillStyle='rgba(8,18,45,.45)';wx.fillRect(0,0,WW,WH);for(let b=0;b<2;b++){wx.beginPath();const base=WH*(.12+b*.1);wx.moveTo(0,base);for(let x=0;x<=WW;x+=14)wx.lineTo(x,base+Math.sin(x/70+ts/1500+b)*20);wx.lineTo(WW,base+70);wx.lineTo(0,base+70);wx.closePath();wx.fillStyle=b?'rgba(170,110,255,.3)':'rgba(90,255,170,.35)';wx.fill()}}
}
